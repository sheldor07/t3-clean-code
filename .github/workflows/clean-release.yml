name: T3 Clean Code release

# Builds unsigned desktop installers for this fork and publishes them as a
# GitHub release. The installers read updates from this repository's releases.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without the leading v (for example 1.0.0)
        required: true
        type: string
      draft:
        description: Create the release as a draft
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-26
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
    steps:
      # actions/checkout's cleanup fails on the orphaned gitlinks under .repos.
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Ensure Rosetta for macOS x64 bytecode generation
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        shell: bash
        run: |
          if [[ "$(uname -m)" == "arm64" ]] && ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi

      # The Apple Speech helper needs the macOS 26 SDK.
      - name: Select Xcode 26
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -n "$xcode" ]]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux desktop build libraries
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config libgtk-3-0t64 libnss3 libasound2t64 libgbm1 imagemagick patchelf

      - name: Align package versions to release version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Build resource monitor
        shell: bash
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"

      - name: Build desktop artifact
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: true
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "$VERSION"
            --verbose
          )
          # macOS builds are signed and notarized when all five Apple secrets are set.
          if [[ "${{ matrix.platform }}" == "mac" && -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"
            echo "macOS signing enabled."
            args+=(--signed)
          else
            echo "Building unsigned."
          fi
          vp run dist:desktop:artifact "${args[@]}"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for file in release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.blockmap release/*.yml; do
            [[ "$file" == */builder-debug.yml ]] && continue
            cp "$file" release-publish/
          done
          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" != "arm64" ]]; then
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-${{ matrix.arch }}.yml"
            done
          fi
          ls -la release-publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Merge macOS update manifests
        run: node scripts/merge-release-update-manifests.ts release-assets

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          ls -la release-assets
          cat > notes.md <<'NOTES'
          T3 Clean Code is an unofficial fork of T3 Code with product analytics, account fingerprinting, relay trace export, mobile crash reports and Google favicon lookups removed. It is not affiliated with T3 Tools, Inc.

          These installers are **not code-signed**.

          - **macOS:** after dragging the app to Applications, run `xattr -cr "/Applications/T3 Clean Code (Beta).app"` once, then open it.
          - **Linux:** `chmod +x` the AppImage and run it.

          Windows builds are not available yet.
          NOTES
          sed -i 's/^          //' notes.md
          flags=()
          if [[ "$DRAFT" == "true" ]]; then flags+=(--draft); fi
          gh release create "v$VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "T3 Clean Code $VERSION" \
            --notes-file notes.md \
            "${flags[@]}"
